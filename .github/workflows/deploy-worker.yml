name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compare with known-working worker
        run: |
          mkdir -p .debug
          echo "=== streambleu (known working) ===" > .debug/compare.txt
          curl -s -i "https://iptv-trial-streambleu.medmaar.workers.dev/" >> .debug/compare.txt
          echo "" >> .debug/compare.txt
          echo "=== norgesiptv ===" >> .debug/compare.txt
          curl -s -i "https://iptv-trial-norgesiptv.medmaar.workers.dev/" >> .debug/compare.txt
          cat .debug/compare.txt

      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@example.com
          git add .debug/compare.txt
          git commit -m "debug: compare workers" || true
          git push || true
